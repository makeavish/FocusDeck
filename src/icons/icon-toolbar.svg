<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Toolbar sizes (16/32/48): full-bleed tile on a 16px grid so they render crisp. -->
  <rect width="16" height="16" rx="3.5" fill="#3346d3" />
  <rect x="5" y="3" width="8" height="7" rx="1.5" fill="#ffffff" fill-opacity="0.5" />
  <rect x="3" y="6" width="8" height="7" rx="1.5" fill="#ffffff" />
  <rect x="5" y="8" width="4" height="1" rx="0.5" fill="#3346d3" />
  <rect x="5" y="10" width="2.5" height="1" rx="0.5" fill="#3346d3" />
</svg>
